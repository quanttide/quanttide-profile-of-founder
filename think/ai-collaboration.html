<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>与 AI 协作 · 认知地图</title>
<style>
  :root {
    --bg: #f8fafc;
    --paper: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --trigger: #d97706;
    --trigger-bg: #fef3c7;
    --event: #2563eb;
    --event-bg: #dbeafe;
    --emotion: #db2777;
    --emotion-bg: #fce7f3;
    --method: #059669;
    --method-bg: #d1fae5;
    --value: #7c3aed;
    --value-bg: #ede9fe;
    --anti: #64748b;
    --anti-bg: #f1f5f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
  }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: -.02em;
  }

  .subtitle {
    margin: 10px 0 0;
    max-width: 780px;
    color: var(--muted);
    font-size: 14px;
  }

  code {
    padding: 1px 5px;
    border-radius: 4px;
    background: #eef2f7;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .92em;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin: 26px 0 14px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 13px;
  }

  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    border: 1px solid;
  }

  .swatch.trigger { background: var(--trigger-bg); border-color: var(--trigger); }
  .swatch.event { background: var(--event-bg); border-color: var(--event); }
  .swatch.emotion { background: var(--emotion-bg); border-color: var(--emotion); }
  .swatch.method { background: var(--method-bg); border-color: var(--method); }
  .swatch.value { background: var(--value-bg); border-color: var(--value); }
  .swatch.anti { background: var(--anti-bg); border-color: var(--anti); }

  .graph-wrap {
    overflow-x: auto;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
  }

  svg {
    display: block;
    width: 100%;
    min-width: 780px;
    height: auto;
  }

  .column-label {
    fill: #94a3b8;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .node rect {
    stroke-width: 1.4;
    transition: filter .18s ease, opacity .18s ease;
  }

  .node.trigger rect { fill: var(--trigger-bg); stroke: var(--trigger); }
  .node.event rect { fill: var(--event-bg); stroke: var(--event); }
  .node.emotion rect { fill: var(--emotion-bg); stroke: var(--emotion); }
  .node.method rect { fill: var(--method-bg); stroke: var(--method); }
  .node.value rect { fill: var(--value-bg); stroke: var(--value); }
  .node.anti rect { fill: var(--anti-bg); stroke: var(--anti); }

  .node .kind {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .node.trigger .kind { fill: #92400e; }
  .node.event .kind { fill: #1e40af; }
  .node.emotion .kind { fill: #9d174d; }
  .node.method .kind { fill: #065f46; }
  .node.value .kind { fill: #5b21b6; }
  .node.anti .kind { fill: #334155; }

  .node .label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 600;
  }

  .node { cursor: pointer; }

  .node:hover rect,
  .node.active rect,
  .node:focus-visible rect {
    filter: drop-shadow(0 0 0.45rem rgba(79, 70, 229, .35));
  }

  .node:focus { outline: none; }
  .node.dim { opacity: .28; }

  .edge path {
    fill: none;
    stroke-width: 1.8;
    transition: opacity .18s ease, stroke-width .18s ease;
  }

  .edge.evokes path { stroke: #d97706; }
  .edge.responds_to path { stroke: #059669; }
  .edge.serves path { stroke: #7c3aed; }
  .edge.excludes path { stroke: #64748b; }

  .edge-label {
    fill: #475569;
    font-size: 11px;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--paper);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  .edge.dim { opacity: .16; }
  .edge.active path { stroke-width: 2.8; }

  .detail {
    margin-top: 14px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
  }

  .detail .detail-kind {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .detail h2 {
    margin: 0 0 6px;
    font-size: 17px;
  }

  .detail p {
    margin: 0;
    color: #475569;
    font-size: 14px;
  }

  details {
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
  }

  details + details { margin-top: 10px; }

  summary {
    cursor: pointer;
    user-select: none;
  }

  pre {
    overflow-x: auto;
    margin: 12px 0 0;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    color: #334155;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
  }

  @media (max-width: 640px) {
    main { padding: 28px 14px 44px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">think / ai-collaboration</p>
    <h1>与 AI 协作 · 认知地图</h1>
    <p class="subtitle">
      数据源是 <code>ai-collaboration.ttl</code>：节点类型、标签与边都从 TTL 解析；
      <code>ai-collaboration.lino</code> 是等价的边列表。左列是情境，中列是情绪，右列是方法。
    </p>
  </header>

  <section class="legend" id="legend" aria-label="图例"></section>

  <div class="graph-wrap">
    <svg id="graph" role="img" aria-labelledby="graph-title graph-desc">
      <title id="graph-title">与 AI 协作认知地图</title>
      <desc id="graph-desc">从 ai-collaboration.ttl 解析出的触发点、事件、情绪与方法有向图。</desc>
      <defs>
        <marker id="arrow-evokes" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"></path>
        </marker>
        <marker id="arrow-responds_to" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"></path>
        </marker>
        <marker id="arrow-serves" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"></path>
        </marker>
        <marker id="arrow-excludes" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path>
        </marker>
      </defs>
      <g id="headers"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </div>

  <section class="detail" id="detail" aria-live="polite">
    <p class="detail-kind">读法</p>
    <h2>从情境到方法</h2>
    <p>
      箭头表示态射方向：触发点或事件唤起情绪，情境与情绪再导向方法。
      悬停节点高亮相连的边，点击节点查看条目摘要。
    </p>
  </section>

  <details>
    <summary>ai-collaboration.ttl（可视化数据源）</summary>
    <pre id="ttl-raw"></pre>
  </details>

  <details>
    <summary>ai-collaboration.lino（等价的边列表）</summary>
    <pre id="lino-raw"></pre>
  </details>
</main>

<script type="text/turtle" id="ttl-source">
# 与 AI 协作 · 知识图谱
#
# 本体与态射定义见 index.ttl；条目原文见 ai-collaboration.md，边见 ai-collaboration.lino。

@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .
@prefix pf:   <urn:quanttide-context:default:profile:> .

pf:AI_变成纯粹执行者 a pf:Trigger ;
    rdfs:label "AI 变成纯粹执行者" ;
    pf:evokes pf:失控与重新掌控 ;
    pf:responds_to pf:刻意引导 .

pf:失控与重新掌控 a pf:Emotion ;
    rdfs:label "失控与重新掌控" ;
    pf:responds_to pf:刻意引导 .

pf:刻意引导 a pf:Method ;
    rdfs:label "刻意引导" ;
    pf:quote "刻意用提示词引导" .

pf:AI_用得不顺手 a pf:Event ;
    rdfs:label "AI 用得不顺手" ;
    pf:responds_to pf:找上下文差异并显性化 .

pf:找上下文差异并显性化 a pf:Method ;
    rdfs:label "找上下文差异并显性化" .
</script>

<script type="text/plain" id="lino-source">
# 与 AI 协作 · link notation
# 一行一条边：起点 --态射--> 终点；态射取自认知地图四个：evokes / responds_to / serves / excludes
# 节点定义见 ai-collaboration.ttl，条目原文见 ai-collaboration.md

AI_变成纯粹执行者 --evokes--> 失控与重新掌控
AI_变成纯粹执行者 --responds_to--> 刻意引导
失控与重新掌控 --responds_to--> 刻意引导
AI_用得不顺手 --responds_to--> 找上下文差异并显性化
</script>

<script>
  const KIND_ORDER = { Trigger: 0, Event: 0, Emotion: 1, Method: 2, Value: 3, Anti: 4 };
  const KIND_LABEL = {
    Trigger: "触发点", Event: "事件", Emotion: "情绪",
    Method: "方法", Value: "价值", Anti: "排除形态", Object: "对象",
  };
  const COLUMN_LABEL = { 0: "情境", 1: "情绪", 2: "方法", 3: "价值", 4: "排除" };
  const EDGE_LABEL = { evokes: "唤起", responds_to: "应对", serves: "服务于", excludes: "排除" };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const W = 220;
  const H = 64;
  const GAP_X = 90;
  const TOP = 90;
  const BOTTOM = 50;
  const HEIGHT = 460;

  function parseTurtle(source) {
    const text = source
      .split("\n")
      .filter((line) => {
        const trimmed = line.trim();
        return trimmed
          && !trimmed.startsWith("#")
          && !trimmed.startsWith("@prefix")
          && !/^PREFIX\b/i.test(trimmed);
      })
      .join("\n");

    const nodes = new Map();
    const edges = [];
    const ensure = (id) => {
      if (!nodes.has(id)) {
        nodes.set(id, { id, label: id, kind: "Object", quote: "" });
      }
      return nodes.get(id);
    };

    for (const rawBlock of text.split(/\.\s*(?=\n|$)/)) {
      const block = rawBlock.trim();
      if (!block) continue;

      let subject = null;
      for (const rawPart of block.split(";")) {
        const part = rawPart.trim();
        if (!part) continue;

        const type = part.match(/^pf:(\S+)\s+a\s+pf:(\w+)$/);
        if (type) {
          subject = type[1];
          ensure(subject).kind = type[2];
          continue;
        }
        if (!subject) continue;

        const label = part.match(/^rdfs:label\s+"([^"]*)"$/);
        if (label) {
          ensure(subject).label = label[1];
          continue;
        }

        const quote = part.match(/^pf:quote\s+"([^"]*)"$/);
        if (quote) {
          ensure(subject).quote = quote[1];
          continue;
        }

        const edge = part.match(/^pf:(evokes|responds_to|serves|excludes)\s+pf:(\S+)$/);
        if (edge) {
          ensure(edge[2]);
          edges.push({ from: subject, to: edge[2], type: edge[1] });
        }
      }
    }

    return { nodes: [...nodes.values()], edges };
  }

  function el(name, attrs = {}) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }
    return node;
  }

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[char]));
  }

  const ttlSource = document.getElementById("ttl-source").textContent.trim();
  const linoSource = document.getElementById("lino-source").textContent.trim();
  document.getElementById("ttl-raw").textContent = ttlSource;
  document.getElementById("lino-raw").textContent = linoSource;

  const { nodes, edges } = parseTurtle(ttlSource);
  const nodeById = new Map(nodes.map((node) => [node.id, node]));

  const groups = new Map();
  for (const node of nodes) {
    const rank = KIND_ORDER[node.kind] ?? 2;
    node.rank = rank;
    if (!groups.has(rank)) groups.set(rank, []);
    groups.get(rank).push(node);
  }

  const ranks = [...groups.keys()].sort((a, b) => a - b);
  let nextX = 60;
  const columnX = new Map();
  for (const rank of ranks) {
    columnX.set(rank, nextX);
    nextX += W + GAP_X;
  }
  const width = Math.max(1000, nextX - GAP_X + 60);

  const available = HEIGHT - TOP - BOTTOM;
  for (const rank of ranks) {
    const group = groups.get(rank).sort((a, b) => a.label.localeCompare(b.label, "zh"));
    group.forEach((node, index) => {
      node.x = columnX.get(rank);
      node.y = group.length === 1
        ? TOP + (available - H) / 2
        : TOP + index * (available - H) / (group.length - 1);
      node.w = W;
      node.h = H;
    });
  }

  const svg = document.getElementById("graph");
  svg.setAttribute("viewBox", `0 0 ${width} ${HEIGHT}`);

  const headersLayer = document.getElementById("headers");
  for (const rank of ranks) {
    const header = el("text", {
      class: "column-label",
      x: columnX.get(rank) + W / 2,
      y: 34,
      "text-anchor": "middle",
    });
    header.textContent = COLUMN_LABEL[rank] ?? "";
    headersLayer.appendChild(header);
  }

  function edgeGeometry(edge) {
    const source = nodeById.get(edge.from);
    const target = nodeById.get(edge.to);
    const sx = source.x + source.w;
    const sy = source.y + source.h / 2;
    const tx = target.x;
    const ty = target.y + target.h / 2;

    if (tx > sx) {
      const dx = (tx - sx) * 0.42;
      const lift = Math.max(0, target.rank - source.rank - 1) * 40;
      const c1 = { x: sx + dx, y: sy - lift };
      const c2 = { x: tx - dx, y: ty - lift };
      return {
        d: `M ${sx} ${sy} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${tx} ${ty}`,
        mid: {
          x: (sx + 3 * c1.x + 3 * c2.x + tx) / 8,
          y: (sy + 3 * c1.y + 3 * c2.y + ty) / 8,
        },
      };
    }

    const lift = Math.min(sy, ty) - 55;
    const c1 = { x: sx + 70, y: lift };
    const c2 = { x: tx - 70, y: lift };
    return {
      d: `M ${sx} ${sy} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${tx} ${ty}`,
      mid: {
        x: (sx + 3 * c1.x + 3 * c2.x + tx) / 8,
        y: (sy + 3 * c1.y + 3 * c2.y + ty) / 8,
      },
    };
  }

  const edgesLayer = document.getElementById("edges");
  for (const edge of edges) {
    const group = el("g", { class: `edge ${edge.type}` });
    group.dataset.from = edge.from;
    group.dataset.to = edge.to;

    const geometry = edgeGeometry(edge);
    group.appendChild(el("path", {
      d: geometry.d,
      "marker-end": `url(#arrow-${edge.type})`,
    }));

    const title = document.createElementNS(SVG_NS, "title");
    title.textContent = `${edge.from} --${edge.type}--> ${edge.to}`;
    group.appendChild(title);

    const label = el("text", {
      class: "edge-label",
      x: geometry.mid.x,
      y: geometry.mid.y - 9,
    });
    label.textContent = EDGE_LABEL[edge.type] ?? edge.type;
    group.appendChild(label);

    edge.el = group;
    edgesLayer.appendChild(group);
  }

  const nodesLayer = document.getElementById("nodes");
  for (const node of nodes) {
    const group = el("g", {
      class: `node ${node.kind.toLowerCase()}`,
      tabindex: "0",
      role: "button",
      "aria-label": `${KIND_LABEL[node.kind] ?? node.kind}：${node.label}`,
    });
    group.dataset.id = node.id;

    group.appendChild(el("rect", {
      x: node.x, y: node.y, width: node.w, height: node.h, rx: 10,
    }));

    const kind = el("text", {
      class: "kind",
      x: node.x + 14,
      y: node.y + 21,
    });
    kind.textContent = `${KIND_LABEL[node.kind] ?? node.kind} ${node.kind}`;

    const label = el("text", {
      class: "label",
      x: node.x + 14,
      y: node.y + 44,
    });
    label.textContent = node.label;

    group.appendChild(kind);
    group.appendChild(label);

    group.addEventListener("mouseenter", () => highlight(node.id));
    group.addEventListener("mouseleave", clearHighlight);
    group.addEventListener("focus", () => highlight(node.id));
    group.addEventListener("blur", clearHighlight);
    group.addEventListener("click", () => showDetail(node.id));
    group.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showDetail(node.id);
      }
    });

    node.el = group;
    nodesLayer.appendChild(group);
  }

  function connectedIds(id) {
    const ids = new Set([id]);
    for (const edge of edges) {
      if (edge.from === id) ids.add(edge.to);
      if (edge.to === id) ids.add(edge.from);
    }
    return ids;
  }

  function highlight(id) {
    const connected = connectedIds(id);
    for (const node of nodes) {
      node.el.classList.toggle("active", node.id === id);
      node.el.classList.toggle("dim", !connected.has(node.id));
    }
    for (const edge of edges) {
      const active = edge.from === id || edge.to === id;
      edge.el.classList.toggle("active", active);
      edge.el.classList.toggle("dim", !active);
    }
  }

  function clearHighlight() {
    for (const node of nodes) node.el.classList.remove("active", "dim");
    for (const edge of edges) edge.el.classList.remove("active", "dim");
  }

  const detail = document.getElementById("detail");
  function showDetail(id) {
    const node = nodeById.get(id);
    if (!node) return;
    const note = node.quote || "条目原文见 ai-collaboration.md 的对应小节。";
    detail.innerHTML = `
      <p class="detail-kind">${escapeHtml(KIND_LABEL[node.kind] ?? node.kind)} ${escapeHtml(node.kind)}</p>
      <h2>${escapeHtml(node.label)}</h2>
      <p>${escapeHtml(note)}</p>
    `;
  }

  const legend = document.getElementById("legend");
  for (const kind of ["Trigger", "Event", "Emotion", "Method", "Value", "Anti"]) {
    if (!nodes.some((node) => node.kind === kind)) continue;
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<span class="swatch ${kind.toLowerCase()}"></span>${KIND_LABEL[kind]} ${kind}`;
    legend.appendChild(item);
  }
  for (const [type, label] of Object.entries(EDGE_LABEL)) {
    if (!edges.some((edge) => edge.type === type)) continue;
    const item = document.createElement("span");
    item.className = "legend-item";
    item.textContent = `→ ${label} ${type}`;
    legend.appendChild(item);
  }
</script>
</body>
</html>
